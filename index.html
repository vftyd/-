<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>3x3 雙控魔術方塊（支援自訂填色自動還原）</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e222d 0%, #0f1117 100%);
      color: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }
    canvas:active {
      cursor: grabbing;
    }

    #ui-top {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
      z-index: 10;
    }
    .panel {
      background: rgba(20, 24, 33, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 14px 16px;
      pointer-events: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }
    #main-panel {
      max-width: 400px;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }
    h1 {
      font-size: 1rem;
      color: #e5e7eb;
      font-weight: 600;
    }
    .front-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.76rem;
      color: #e2e8f0;
      white-space: nowrap;
    }
    .front-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #16a34a;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    #timer {
      font-size: 2.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #4ade80;
      line-height: 1.05;
      margin-top: 2px;
    }
    #status {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-top: 4px;
      line-height: 1.4;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    button {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    button:hover { background: #1d4ed8; }
    button:active { transform: scale(0.96); }
    button.secondary { background: #374151; }
    button.secondary:hover { background: #4b5563; }
    button.accent { background: #059669; }
    button.accent:hover { background: #047857; }
    button.warn { background: #b45309; }
    button.warn:hover { background: #92400e; }

    .speed-box {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .speed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      color: #cbd5e1;
      margin-bottom: 4px;
    }
    #speed-val {
      color: #60a5fa;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #3b82f6;
      cursor: pointer;
      height: 18px;
    }
    .speed-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-top: 4px;
    }
    .speed-presets button {
      background: #1f2937;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 2px;
      font-size: 0.72rem;
      border-radius: 6px;
      color: #d1d5db;
    }
    .speed-presets button.active {
      background: #2563eb;
      color: #fff;
      border-color: #60a5fa;
    }

    #color-palette-box {
      display: none;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }
    #color-palette-box.show {
      display: block;
    }
    .palette-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .color-counts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.72rem;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .count-tag {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
    }
    .count-tag.ok { color: #4ade80; }
    .count-tag.err { color: #f87171; }
    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .swatch.selected {
      transform: scale(1.18);
      border-color: #ffffff;
      box-shadow: 0 0 0 2px #3b82f6;
    }

    #keymap {
      font-size: 0.8rem;
      line-height: 1.65;
      max-width: 340px;
    }
    #keymap h3 {
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #60a5fa;
    }
    .key-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px 12px;
    }
    kbd {
      background: #2d333f;
      border: 1px solid #4b5563;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: monospace;
      color: #f9fafb;
    }
    .hint {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-size: 0.75rem;
      line-height: 1.45;
    }

    #mobile-pad-toggle { display: none; }
    #touch-pad {
      position: fixed;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: max(10px, env(safe-area-inset-left));
      right: max(10px, env(safe-area-inset-right));
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }
    .pad-card {
      width: 100%;
      max-width: 520px;
      background: rgba(20, 24, 33, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 8px 10px;
      pointer-events: auto;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    }
    .pad-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: #9ca3af;
      margin-bottom: 6px;
      padding: 0 2px;
    }
    .pad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .pad-btn {
      background: #262c3a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      padding: 9px 4px;
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.15;
    }
    .pad-btn span.sub {
      font-size: 0.66rem;
      font-weight: 400;
      color: #93c5fd;
      margin-top: 2px;
    }
    .pad-btn:active {
      background: #2563eb;
      transform: scale(0.95);
    }

    @media (max-width: 820px) {
      #keymap { display: none; }
      #main-panel {
        width: 10
